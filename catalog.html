  <meta charset="utf-8">

  <link rel="icon" href="favicon.ico" sizes="any">

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#05275b">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Carasia Consulting">
  <meta property="og:title" content="Products | Carasia Consulting">

</head>
<body data-page="catalog">
  <header class="catalog-header">
    <div class="container catalog-nav">
      <a class="catalog-logo" href="index.html" aria-label="Carasia Consulting"><img src="carasia-logo.webp" alt="Carasia Consulting"></a>
      <nav class="catalog-links" id="catalog-navigation" data-aria-en="Main navigation" data-aria-es="Navegación principal" aria-label="Main navigation">
        <details class="products-menu">
          <summary><span data-en="Products" data-es="Productos">Products</span></summary>
          <div class="products-dropdown">
            <a href="catalog.html" data-category="all" data-en="All Products" data-es="Todos los productos">All Products</a>
            <a href="catalog.html?category=Vehicle%20Accessories" data-category="Vehicle Accessories" data-en="Vehicle Accessories" data-es="Accesorios para vehículos">Vehicle Accessories</a>
            <a href="catalog.html?category=Construction%20Tools" data-category="Construction Tools" data-en="Construction Tools" data-es="Herramientas de construcción">Construction Tools</a>
            <a href="catalog.html?category=Metals%20%26%20Alloys" data-category="Metals &amp; Alloys" data-en="Metals &amp; Alloys" data-es="Metales y aleaciones">Metals &amp; Alloys</a>
            <a href="catalog.html?category=LED%20Lights" data-category="LED Lights" data-en="LED Lights" data-es="Luces LED">LED Lights</a>
            <a href="catalog.html?category=Solar%20%26%20Energy" data-category="Solar &amp; Energy" data-en="Solar &amp; Energy" data-es="Energía solar y almacenamiento">Solar &amp; Energy</a>
          </div>
        </details>
        <a href="index.html#process" data-en="Services" data-es="Servicios">Services</a>
        <a href="index.html#proof" data-en="About" data-es="Nosotros">About</a>
        <a href="index.html#contact" data-en="Contact" data-es="Contacto">Contact</a>
      </nav>
      <div class="language-switcher" data-aria-en="Language" data-aria-es="Idioma" aria-label="Language">
        <button class="lang-button" type="button" data-lang="es">ES</button><span>|</span>
        <button class="lang-button active" type="button" data-lang="en">EN</button>
      </div>
      <button class="catalog-menu-button" type="button" aria-controls="catalog-navigation" aria-expanded="false" aria-label="Open menu"><span></span></button>
    </div>
  </header>
  <main>
    <section class="catalog-hero">
      <div class="container">
        <div class="catalog-hero-content">
          <span class="eyebrow" data-en="Product Catalog" data-es="Catálogo de productos">Product Catalog</span>
          <h1 data-en="Products" data-es="Productos">Products</h1>
          <p data-en="Products selected for real business needs." data-es="Productos seleccionados para necesidades empresariales reales.">Products selected for real business needs.</p>
          <div class="catalog-tools" data-aria-en="Catalog tools" data-aria-es="Herramientas del catálogo" aria-label="Catalog tools">
            <div class="search-row">
              <input id="product-search" type="search" data-placeholder-en="Search by product, model, or application" data-placeholder-es="Buscar por producto, modelo o aplicación" placeholder="Search by product, model, or application" data-aria-en="Search products" data-aria-es="Buscar productos" aria-label="Search products">
              <div class="result-count" id="result-count"></div>
            </div>
            <div class="filter-row" id="category-filters"></div>
          </div>
        </div>
        <div class="trade-globe" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </section>
    <section class="catalog-content"><div class="container" id="catalog-results"></div></section>
  </main>
  <footer class="catalog-footer"><div class="container"><span>© <span class="current-year">2026</span> Carasia Consulting · <a href="privacy.html" data-en="Privacy" data-es="Privacidad">Privacy</a></span><span data-en="Product sourcing with clear communication" data-es="Abastecimiento de productos con comunicación clara">Product sourcing with clear communication</span></div></footer>
  <script src="assets/catalog.js?v=20261107-8"></script>
  <script>
    const catalogMenuButton = document.querySelector(".catalog-menu-button");
    const catalogNavigation = document.getElementById("catalog-navigation");
    const menuLabel = open => document.documentElement.lang === "es"
      ? (open ? "Cerrar menú" : "Abrir menú")
      : (open ? "Close menu" : "Open menu");
    catalogMenuButton?.addEventListener("click", () => {
      const isOpen = catalogMenuButton.getAttribute("aria-expanded") === "true";
      catalogMenuButton.setAttribute("aria-expanded", String(!isOpen));
      catalogMenuButton.setAttribute("aria-label", menuLabel(!isOpen));
      catalogNavigation?.classList.toggle("mobile-open", !isOpen);
    });
    catalogNavigation?.querySelectorAll("a").forEach(link => link.addEventListener("click", () => {
      catalogNavigation.classList.remove("mobile-open");
      catalogMenuButton?.setAttribute("aria-expanded", "false");
      catalogMenuButton?.setAttribute("aria-label", menuLabel(false));
    }));
  </script>
</body>
</html>
